[project]
name = "drop-your-moment"
version = "0.1.0"
description = "Drop Your Moment — backend du photobooth : kiosque tactile + portail d'administration"
requires-python = ">=3.11"

# picamera2 et pycups ne figurent pas ici volontairement : sur Raspberry Pi OS ce sont
# des paquets apt (python3-picamera2, python3-cups) liés aux bibliothèques système, et
# le venv du Pi doit être créé avec --system-site-packages pour les voir. Les installer
# par pip n'est pas fiable, et le backend doit démarrer sans eux (driver mock sur Mac).
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pillow>=11.0",
]

# Extra et non groupe PEP 735 : opencv est bien une dépendance d'exécution — pour qui
# l'installe. ~90 Mo avec numpy, qui n'ont rien à faire sur le Pi, dont le capteur CSI
# passe par picamera2. `uv sync --no-dev` sur la borne ne le prend pas ; sur un poste de
# bureau, `uv sync --extra webcam` active le driver webcam universel.
[project.optional-dependencies]
webcam = ["opencv-python>=4.10"]

# Groupe de dépendances au sens PEP 735 plutôt qu'un extra : ces outils servent au
# développement, jamais à l'exécution, et n'ont donc rien à faire dans la distribution.
# `uv sync` les installe par défaut, `uv sync --no-dev` les laisse de côté — ce qui est
# exactement ce qu'on veut sur la borne.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dropyourmoment*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# `Depends(...)` en valeur par défaut est l'idiome d'injection de FastAPI : c'est le
# framework qui résout l'appel par requête, pas Python à la définition. B008 ne s'applique
# donc pas ici.
"dropyourmoment/api/*.py" = ["B008"]
