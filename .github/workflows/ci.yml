name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 est la version de Raspberry Pi OS Trixie, la cible de déploiement.
        # 3.11 garde le plancher déclaré dans pyproject honnête.
        python-version: ["3.11", "3.13"]

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      # Version complète et non un tag majeur mobile : setup-uv ne publie plus de tag
      # court depuis la v8, et `@v10` ne se résout pas.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          # Sans suffixe, les deux jobs de la matrice se disputent la même clé et
          # l'un échoue à écrire le cache.
          cache-suffix: py${{ matrix.python-version }}

      # --locked échoue si uv.lock ne correspond plus à pyproject.toml : une dépendance
      # ajoutée sans relock ne passera pas inaperçue.
      - name: Installer les dépendances
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check dropyourmoment tests

      - name: Formatage
        run: uv run ruff format --check dropyourmoment tests

      # Aucun matériel n'est nécessaire : les drivers de synthèse couvrent la caméra et
      # l'imprimante, ce qui est précisément la raison de leur existence.
      - name: Tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      # La version de pnpm vient du champ packageManager de package.json : une seule
      # source de vérité pour la machine de développement, la CI et le Pi.
      #
      # Le chemin doit être explicite : `defaults.run.working-directory` ne s'applique
      # qu'aux étapes `run:`, pas aux actions `uses:`, qui partent de la racine du dépôt.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # --frozen-lockfile échoue si pnpm-lock.yaml ne correspond plus à package.json.
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Contrôle de types
        run: pnpm run typecheck

      # Le déploiement sur le Pi passe par ce même build : le vérifier ici évite de
      # découvrir une compilation cassée sur place, au moment de brancher la borne.
      - name: Build
        run: pnpm run build
