name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 est la version de Raspberry Pi OS Trixie, la cible de déploiement.
        # 3.11 garde le plancher déclaré dans pyproject honnête.
        python-version: ["3.11", "3.13"]

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      # Version complète et non un tag majeur mobile : setup-uv ne publie plus de tag
      # court depuis la v8, et `@v10` ne se résout pas.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --locked échoue si uv.lock ne correspond plus à pyproject.toml : une dépendance
      # ajoutée sans relock ne passera pas inaperçue.
      - name: Installer les dépendances
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check dropyourmoment tests

      - name: Formatage
        run: uv run ruff format --check dropyourmoment tests

      # Aucun matériel n'est nécessaire : les drivers de synthèse couvrent la caméra et
      # l'imprimante, ce qui est précisément la raison de leur existence.
      - name: Tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Contrôle de types
        run: npm run typecheck

      # Le déploiement sur le Pi passe par ce même build : le vérifier ici évite de
      # découvrir une compilation cassée sur place, au moment de brancher la borne.
      - name: Build
        run: npm run build
