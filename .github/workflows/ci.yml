name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 est la version de Raspberry Pi OS Trixie, la cible de déploiement.
        # 3.11 garde le plancher déclaré dans pyproject honnête.
        python-version: ["3.11", "3.13"]

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Installer les dépendances
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check dropyourmoment tests

      - name: Formatage
        run: ruff format --check dropyourmoment tests

      # Aucun matériel n'est nécessaire : les drivers de synthèse couvrent la caméra et
      # l'imprimante, ce qui est précisément la raison de leur existence.
      - name: Tests
        run: pytest -q
